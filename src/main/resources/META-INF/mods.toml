############################################################
# mods.toml
# このファイルは「このMODが何者か」をForgeに伝える設定ファイル
# MODのID・名前・バージョン・依存関係などを定義する
############################################################

# 使用するMODローダーの種類
# Forgeの @Mod を使う場合は必ず "javafml"
modLoader="javafml"

# 対応するForgeローダーのバージョン範囲
# 通常は build.gradle 側で定義された値が入る
loaderVersion="${loader_version_range}"

# ライセンス表記（必須）
# 配布条件を明示するためのもの
license="${mod_license}"


############################################################
# MOD本体の定義（ここが一番重要）
############################################################
[[mods]]

# MODの一意なID
# @Mod(MobCatch.MOD_ID) と完全一致している必要がある
modId="${mod_id}"

# MODのバージョン
version="${mod_version}"

# MODの表示名（MOD一覧画面に出る）
displayName="${mod_name}"

# 作者名（任意）
authors="${mod_authors}"

# MODの説明文（MOD一覧画面に表示される）
description='''
${mod_description}
'''


############################################################
# Forge への依存関係
############################################################
[[dependencies.${mod_id}]]

# 依存先MODのID（Forge自身）
modId="forge"

# 必須かどうか（Forgeが無いと動かないので true）
mandatory=true

# 対応Forgeバージョン範囲
versionRange="${forge_version_range}"

# 読み込み順（特に指定しない）
ordering="NONE"

# 適用環境（クライアント・サーバー両方）
side="BOTH"


############################################################
# Minecraft 本体への依存関係
############################################################
[[dependencies.${mod_id}]]

# 依存先は Minecraft 本体
modId="minecraft"

mandatory=true

# 対応Minecraftバージョン範囲
versionRange="${minecraft_version_range}"

ordering="NONE"
side="BOTH"
