plugins {
    // IDE向け設定（Eclipse / IntelliJ）
    id 'eclipse'
    id 'idea'

    // Maven形式で成果物を出すため（今は使わなくてもOK）
    id 'maven-publish'

    // ForgeGradle（Forge MOD開発用のGradleプラグイン）
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

////////////////////////////////////////////////////////////
// MODの基本メタ情報
////////////////////////////////////////////////////////////

// version / group / archivesName は jar の名前やメタ情報に使われる
// これらの値は gradle.properties 側で定義されている前提
version = mod_version
group = mod_group_id

base {
    // 生成されるjarのベース名（通常 mod_id と同じでOK）
    archivesName = mod_id
}

////////////////////////////////////////////////////////////
// Minecraft 1.20.5+ はエンドユーザーも Java 21 なので、MODも Java 21 をターゲットにする
////////////////////////////////////////////////////////////
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// 起動ログにJava情報を出すだけ（動作には必須ではない）
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"


minecraft {
    ////////////////////////////////////////////////////////////
    // マッピング（メソッド名/フィールド名の辞書）
    ////////////////////////////////////////////////////////////
    // official: Mojang公式の名前
    // parchment: officialにパラメータ名やjavadoc等を重ねたコミュニティ版（追加設定が必要）
    // ここは gradle.properties の mapping_channel / mapping_version を参照している
    mappings channel: mapping_channel, version: mapping_version

    // 公式マッピングをランタイムでも使うため、reobfタスクを自動生成しない設定
    reobf = false

    ////////////////////////////////////////////////////////////
    // IDE実行で resources（mods.toml など）を IDE出力先へコピーする
    // テンプレとしてはこれを true にしておくのが必須
    ////////////////////////////////////////////////////////////
    copyIdeResources = true

    ////////////////////////////////////////////////////////////
    // 実行構成（runClient / runServer / data など）
    ////////////////////////////////////////////////////////////
    runs {
        // 下の client / server / data すべてに共通の設定
        configureEach {
            // 実行ディレクトリ（ここにワールドやログが出る）
            workingDirectory project.file('run')

            // Forgeのログに「レジストリ関係のログ」を出す（デバッグで便利）
            property 'forge.logging.markers', 'REGISTRIES'

            // コンソールログのレベル（debugだと情報が多い）
            property 'forge.logging.console.level', 'debug'
        }

        // ./gradlew runClient が使う設定
        client {
            // この名前空間(mod_id)のGameTestを読み込む（空なら全namespace）
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        // ./gradlew runServer が使う設定
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // GameTest専用サーバー（テスト走らせて終了）
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        // データ生成（レシピ/モデル/言語ファイルなどを自動生成する用途）
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id,
                 '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
        }
    }
}

////////////////////////////////////////////////////////////
// data生成で作ったリソースも、通常リソースとして扱う
////////////////////////////////////////////////////////////
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // 追加の依存MODを取ってくるリポジトリがあればここに追加する
    // 何も追加しなくても ForgeGradle が Forge/MavenCentral を見てくれる
}

dependencies {
    ////////////////////////////////////////////////////////////
    // Minecraft + Forge 本体（ユーザー開発環境 userdev）を指定
    ////////////////////////////////////////////////////////////
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // ここに JEI 等の依存MODを追加していく（今は不要なら触らないでOK）
}

////////////////////////////////////////////////////////////
// resources の変数置換（超重要）
////////////////////////////////////////////////////////////
// mods.toml の ${mod_id} とかを、gradle.properties の値で置き換える処理
// copyIdeResources=true のとき IDE 実行前にも走る
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,

            forge_version: forge_version,
            forge_version_range: forge_version_range,

            loader_version_range: loader_version_range,

            // ★ここが mods.toml の ${mod_id} 等に入る値
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    // 指定したファイル内の ${} を replaceProperties で展開する
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

////////////////////////////////////////////////////////////
// jar の manifest（メタ情報）設定
////////////////////////////////////////////////////////////
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors
        ])
    }
}

////////////////////////////////////////////////////////////
// Maven publish（いまは不要なら気にしなくてOK）
////////////////////////////////////////////////////////////
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

////////////////////////////////////////////////////////////
// コンパイルの文字コード（日本語リソース等で事故らない）
////////////////////////////////////////////////////////////
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

////////////////////////////////////////////////////////////
// IntelliJがソース/Javadocを取る設定（便利だけど必須ではない）
////////////////////////////////////////////////////////////
idea.module { downloadJavadoc = downloadSources = true }

////////////////////////////////////////////////////////////
// Eclipse向け設定（必須ではない）
////////////////////////////////////////////////////////////
eclipse {
    synchronizationTasks 'genEclipseRuns'
}

////////////////////////////////////////////////////////////
// classes と resources を同じ出力先にまとめる（ForgeGradleテンプレの都合）
////////////////////////////////////////////////////////////
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
